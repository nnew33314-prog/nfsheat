# .github/workflows/build.yml
# Fixed GoldHEN SDK header installation

name: Build NFS Heat Drift/Grip Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compile .prx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 curl git ca-certificates findutils

      - name: Download & extract OpenOrbis toolchain
        run: |
          mkdir -p /opt/orbiskate/tools
          cd /opt/orbiskate/tools
          curl -fL --retry 3 -o toolchain-llvm-18.tar.gz \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  toolchain-llvm-18.tar.gz" | sha256sum -c -
          mkdir -p tmp_extract
          tar -xzf toolchain-llvm-18.tar.gz -C tmp_extract
          TOOLCHAIN_ROOT=$(find tmp_extract -name "link.x" -type f | head -1 | xargs dirname)
          echo "Found toolchain at: $TOOLCHAIN_ROOT"
          mkdir -p openorbis-0.5.4
          cp -r "$TOOLCHAIN_ROOT"/* openorbis-0.5.4/
          test -f openorbis-0.5.4/bin/linux/create-fself && echo "create-fself OK"
          test -f openorbis-0.5.4/link.x && echo "link.x OK"

      - name: Install GoldHEN Plugins SDK (verify structure)
        run: |
          git clone --depth 1 --branch main https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git /opt/orbiskate/tools/goldhen-plugins-sdk
          echo "=== GoldHEN SDK structure ==="
          find /opt/orbiskate/tools/goldhen-plugins-sdk -name "*.h" -type f
          echo "=== Copying headers ==="
          cp -r /opt/orbiskate/tools/goldhen-plugins-sdk/include/* /opt/orbiskate/tools/openorbis-0.5.4/include/ 2>/dev/null || true
          mkdir -p /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen
          cp /opt/orbiskate/tools/goldhen-plugins-sdk/source/Detour.c /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen/ 2>/dev/null || true
          cp /opt/orbiskate/tools/goldhen-plugins-sdk/source/HDE64.c /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen/ 2>/dev/null || true
          echo "=== Verifying goldhen headers ==="
          ls -la /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen/ 2>/dev/null || echo "goldhen dir not found"

      - name: Generate minimal PS4 SDK headers (no duplicates)
        run: |
          mkdir -p /opt/orbiskate/tools/openorbis-0.5.4/include/ps4
          
          cat > /opt/orbiskate/tools/openorbis-0.5.4/include/ps4/standard.h << 'EOF'
          #ifndef PS4_STANDARD_H
          #define PS4_STANDARD_H
          #include <stdint.h>
          #include <stddef.h>
          #include <stdbool.h>
          #include <stdio.h>
          #include <string.h>
          #include <stdlib.h>
          #include <stdarg.h>
          /* ssize_t may be defined by toolchain - don't redefine */
          #endif
          EOF

          cat > /opt/orbiskate/tools/openorbis-0.5.4/include/ps4/kernel.h << 'EOF'
          #ifndef PS4_KERNEL_H
          #define PS4_KERNEL_H
          #include <ps4/standard.h>
          #define RTLD_DEFAULT ((void*)-1)
          extern void* sceKernelDlsym(void* handle, const char* name);
          extern int sceKernelGetProcessId(void);
          extern void sceKernelUsleep(unsigned int useconds);
          extern void sceKernelDebugOutText(int unk, const char* text, size_t len);
          #endif
          EOF

          cat > /opt/orbiskate/tools/openorbis-0.5.4/include/ps4/module.h << 'EOF'
          #ifndef PS4_MODULE_H
          #define PS4_MODULE_H
          #include <ps4/standard.h>
          #endif
          EOF

          cat > /opt/orbiskate/tools/openorbis-0.5.4/include/ps4/linker.h << 'EOF'
          #ifndef PS4_LINKER_H
          #define PS4_LINKER_H
          #include <ps4/standard.h>
          #endif
          EOF

          cat > /opt/orbiskate/tools/openorbis-0.5.4/include/ps4/memory.h << 'EOF'
          #ifndef PS4_MEMORY_H
          #define PS4_MEMORY_H
          #include <ps4/standard.h>
          extern void* malloc(size_t size);
          extern void free(void* ptr);
          extern void* memcpy(void* dest, const void* src, size_t n);
          extern void* memset(void* s, int c, size_t n);
          #endif
          EOF

          cat > /opt/orbiskate/tools/openorbis-0.5.4/include/ps4/filesystem.h << 'EOF'
          #ifndef PS4_FILESYSTEM_H
          #define PS4_FILESYSTEM_H
          #include <ps4/standard.h>
          #include <sys/stat.h>
          #include <fcntl.h>
          extern int sceIoOpen(const char* path, int flags, mode_t mode);
          extern int sceIoClose(int fd);
          extern ssize_t sceIoRead(int fd, void* buf, size_t nbyte);
          extern ssize_t sceIoWrite(int fd, const void* buf, size_t nbyte);
          extern off_t sceIoLseek(int fd, off_t offset, int whence);
          #define O_RDONLY 0x0000
          #define O_WRONLY 0x0001
          #define O_RDWR 0x0002
          #endif
          EOF

          cat > /opt/orbiskate/tools/openorbis-0.5.4/include/ps4/fcntl.h << 'EOF'
          #ifndef PS4_FCNTL_H
          #define PS4_FCNTL_H
          #include <ps4/standard.h>
          #define O_RDONLY 0x0000
          #define O_WRONLY 0x0001
          #define O_RDWR 0x0002
          #define O_CREAT 0x0200
          #define O_TRUNC 0x0400
          #define O_APPEND 0x0008
          #endif
          EOF

          cat > /opt/orbiskate/tools/openorbis-0.5.4/include/ps4/errno.h << 'EOF'
          #ifndef PS4_ERRNO_H
          #define PS4_ERRNO_H
          #include <errno.h>
          #endif
          EOF

          cat > /opt/orbiskate/tools/openorbis-0.5.4/include/ps4/syscall.h << 'EOF'
          #ifndef PS4_SYSCALL_H
          #define PS4_SYSCALL_H
          #include <ps4/standard.h>
          #endif
          EOF

          cat > /opt/orbiskate/tools/openorbis-0.5.4/include/ps4/pthread.h << 'EOF'
          #ifndef PS4_PTHREAD_H
          #define PS4_PTHREAD_H
          #include <ps4/standard.h>
          typedef void* ScePthread;
          typedef void* ScePthreadAttr;
          extern int scePthreadCreate(ScePthread* thread, const ScePthreadAttr* attr, void* (*start)(void*), void* arg, const char* name);
          extern int scePthreadDetach(ScePthread thread);
          #endif
          EOF

          cat > /opt/orbiskate/tools/openorbis-0.5.4/include/ps4/ctrl.h << 'EOF'
          #ifndef PS4_CTRL_H
          #define PS4_CTRL_H
          #include <ps4/standard.h>
          #define SCE_CTRL_L3        (1u << 10)
          #define SCE_CTRL_R3        (1u << 11)
          #define SCE_CTRL_UP        (1u << 12)
          #define SCE_CTRL_DOWN      (1u << 13)
          #define SCE_CTRL_LEFT      (1u << 14)
          #define SCE_CTRL_RIGHT     (1u << 15)
          #define SCE_CTRL_CROSS     (1u << 16)
          #define SCE_CTRL_CIRCLE    (1u << 17)
          typedef struct { uint32_t buttons; } SceCtrlData;
          extern int sceCtrlPeekBufferPositive(int port, SceCtrlData* data, int count);
          #endif
          EOF

          echo "Generated PS4 SDK stub headers"
          ls -la /opt/orbiskate/tools/openorbis-0.5.4/include/ps4/

      - name: Create missing GoldHEN stub headers if needed
        run: |
          mkdir -p /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen
          
          if [ ! -f /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen/menu.h ]; then
            cat > /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen/menu.h << 'EOF'
            #ifndef GOLDHEN_MENU_H
            #define GOLDHEN_MENU_H
            #include <stdint.h>
            #include <stdbool.h>
            #define GOLDHEN_MENU_FLAG_CENTERED  (1u << 0)
            #define GOLDHEN_MENU_FLAG_BACKDROP  (1u << 1)
            typedef struct goldhen_menu goldhen_menu_t;
            typedef void (*goldhen_menu_callback_t)(int);
            extern int goldhen_menu_create(const char* title, uint32_t flags);
            extern void goldhen_menu_destroy(int handle);
            extern void goldhen_menu_add_item(int handle, const char* label, int value, goldhen_menu_callback_t cb);
            extern void goldhen_menu_add_separator(int handle);
            extern void goldhen_menu_set_visible(int handle, bool visible);
            extern void goldhen_menu_set_hotkey(int handle, uint32_t key);
            extern void goldhen_menu_navigate(int handle, int direction);
            extern void goldhen_menu_select(int handle);
            extern void goldhen_menu_set_item_label(int handle, int index, const char* label);
            #define GOLDHEN_MENU_API
            #endif
            EOF
            echo "Created stub goldhen/menu.h"
          fi
          
          if [ ! -f /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen/input.h ]; then
            cat > /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen/input.h << 'EOF'
            #ifndef GOLDHEN_INPUT_H
            #define GOLDHEN_INPUT_H
            #include <stdint.h>
            typedef struct { uint32_t buttons; } goldhen_input_state_t;
            extern int goldhen_input_get_state(int port, goldhen_input_state_t* state);
            #define GOLDHEN_INPUT_API
            #endif
            EOF
            echo "Created stub goldhen/input.h"
          fi
          
          if [ ! -f /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen/hook.h ]; then
            cat > /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen/hook.h << 'EOF'
            #ifndef GOLDHEN_HOOK_H
            #define GOLDHEN_HOOK_H
            #include <stdint.h>
            extern int goldhen_hook_install(void* target, void* replacement, void** original);
            extern int goldhen_hook_remove(void* target);
            #define GOLDHEN_HOOK_API
            #endif
            EOF
            echo "Created stub goldhen/hook.h"
          fi
          
          if [ ! -f /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen/time.h ]; then
            cat > /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen/time.h << 'EOF'
            #ifndef GOLDHEN_TIME_H
            #define GOLDHEN_TIME_H
            #include <stdint.h>
            extern uint64_t goldhen_time_get_ms(void);
            #define GOLDHEN_TIME_API
            #endif
            EOF
            echo "Created stub goldhen/time.h"
          fi
          
          echo "=== Final goldhen headers ==="
          ls -la /opt/orbiskate/tools/openorbis-0.5.4/include/goldhen/

      - name: Compile plugin
        run: |
          mkdir -p build/obj
          clang-18 --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -Wall -Wextra -O2 \
            -isysroot /opt/orbiskate/tools/openorbis-0.5.4 \
            -isystem /opt/orbiskate/tools/openorbis-0.5.4/include \
            -I/opt/orbiskate/tools/openorbis-0.5.4/include \
            -c nfs_heat_drift_grip.c -o build/obj/nfs_heat_drift_grip.o

      - name: Link plugin
        run: |
          ld.lld-18 -m elf_x86_64 -pie \
            --script /opt/orbiskate/tools/openorbis-0.5.4/link.x \
            -e _init --eh-frame-hdr \
            -L/opt/orbiskate/tools/openorbis-0.5.4/lib \
            -lSceLibcInternal -lkernel -lSceUserService -lSceSysmodule \
            build/obj/nfs_heat_drift_grip.o -o build/nfs_heat_drift_grip.elf

      - name: Create .prx
        run: |
          /opt/orbiskate/tools/openorbis-0.5.4/bin/linux/create-fself \
            -in=build/nfs_heat_drift_grip.elf \
            -out=build/nfs_heat_drift_grip.oelf \
            --lib=build/nfs_heat_drift_grip.prx \
            --paid=0x3800000000000011

      - name: Upload .prx artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfs_heat_drift_grip.prx
          path: build/nfs_heat_drift_grip.prx
          retention-days: 7
