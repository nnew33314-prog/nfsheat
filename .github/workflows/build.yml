name: Build NFS Heat Drift/Grip Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compile .prx
    runs-on: ubuntu-latest
    env:
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/_deps/openorbis/OpenOrbis/PS4Toolchain
      GOLDHEN_SDK: ${{ github.workspace }}/_deps/GoldHEN_Plugins_SDK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 make curl git
          sudo ln -sf "$(command -v clang-18)"   /usr/local/bin/clang
          sudo ln -sf "$(command -v ld.lld-18)"  /usr/local/bin/ld.lld
          sudo ln -sf "$(command -v llvm-ar-18)" /usr/local/bin/llvm-ar
          clang --version | head -1

      - name: Download OpenOrbis toolchain
        run: |
          mkdir -p _deps/openorbis
          curl -fL --retry 3 -o _deps/toolchain.tar.gz \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  _deps/toolchain.tar.gz" | sha256sum -c -
          tar -xzf _deps/toolchain.tar.gz -C _deps/openorbis
          test -f "$OO_PS4_TOOLCHAIN/link.x"
          test -f "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
          chmod +x "$OO_PS4_TOOLCHAIN"/bin/linux/*

      - name: Get GoldHEN SDK
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$GOLDHEN_SDK"

      - name: Get GoldHEN Plugin Repository (for plugin_common.h)
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_Repository.git _deps/plugins

      - name: Build GoldHEN SDK library
        run: make -C "$GOLDHEN_SDK" PRINTF=1

      - name: Build plugin
        run: |
          mkdir -p _deps/plugins/bin/plugins/prx_final _deps/plugins/bin/plugins/elf_final _deps/plugins/plugin_src
          cp -r nfs_heat_drift_grip _deps/plugins/plugin_src/
          cp _deps/plugins/plugin_common.h _deps/plugins/plugin_src/nfs_heat_drift_grip/
          cd _deps/plugins
          make -C plugin_src/nfs_heat_drift_grip DEBUG=0
          ls -la bin/plugins/prx_final/

      - name: Upload .prx
        uses: actions/upload-artifact@v4
        with:
          name: nfs_heat_drift_grip
          path: _deps/plugins/bin/plugins/prx_final/nfs_heat_drift_grip.prx
          if-no-files-found: error
          retention-days: 30
