# .github/workflows/build.yml
# Complete fixed version - copy/paste entire file

name: Build NFS Heat Drift/Grip Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compile .prx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 curl git ca-certificates

      - name: Download OpenOrbis toolchain
        run: |
          mkdir -p /opt/orbiskate/tools
          cd /opt/orbiskate/tools
          curl -fL --retry 3 -o toolchain-llvm-18.tar.gz \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  toolchain-llvm-18.tar.gz" | sha256sum -c -
          tar -xzf toolchain-llvm-18.tar.gz
          mv OpenOrbis-PS4-Toolchain-* openorbis-0.5.4 2>/dev/null || mv OpenOrbis-PS4-Toolchain openorbis-0.5.4 2>/dev/null || true

      - name: Install GoldHEN SDK headers
        run: |
          mkdir -p /opt/orbiskate/tools/openorbis-0.5.4/OpenOrbis/PS4Toolchain/include
          curl -fL -o /tmp/goldhen_menu.h https://raw.githubusercontent.com/si-stron/goldhen/master/include/goldhen/menu.h
          curl -fL -o /tmp/goldhen_input.h https://raw.githubusercontent.com/si-stron/goldhen/master/include/goldhen/input.h
          curl -fL -o /tmp/goldhen_hook.h https://raw.githubusercontent.com/si-stron/goldhen/master/include/goldhen/hook.h
          curl -fL -o /tmp/goldhen_time.h https://raw.githubusercontent.com/si-stron/goldhen/master/include/goldhen/time.h
          curl -fL -o /tmp/goldhen_common.h https://raw.githubusercontent.com/si-stron/goldhen/master/include/goldhen/common.h
          cp /tmp/goldhen_*.h /opt/orbiskate/tools/openorbis-0.5.4/OpenOrbis/PS4Toolchain/include/

      - name: Compile plugin
        run: |
          mkdir -p build/obj
          clang-18 --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -Wall -Wextra -O2 \
            -isysroot /opt/orbiskate/tools/openorbis-0.5.4/OpenOrbis/PS4Toolchain \
            -isystem /opt/orbiskate/tools/openorbis-0.5.4/OpenOrbis/PS4Toolchain/include \
            -I/opt/orbiskate/tools/openorbis-0.5.4/OpenOrbis/PS4Toolchain/include \
            -c nfs_heat_drift_grip.c -o build/obj/nfs_heat_drift_grip.o

      - name: Link plugin
        run: |
          ld.lld-18 -m elf_x86_64 -pie \
            --script /opt/orbiskate/tools/openorbis-0.5.4/OpenOrbis/PS4Toolchain/link.x \
            -e _init --eh-frame-hdr \
            -L/opt/orbiskate/tools/openorbis-0.5.4/OpenOrbis/PS4Toolchain/lib \
            -lSceLibcInternal -lkernel -lSceUserService -lSceSysmodule \
            build/obj/nfs_heat_drift_grip.o -o build/nfs_heat_drift_grip.elf

      - name: Create .prx
        run: |
          /opt/orbiskate/tools/openorbis-0.5.4/OpenOrbis/PS4Toolchain/bin/linux/create-fself \
            -in=build/nfs_heat_drift_grip.elf \
            -out=build/nfs_heat_drift_grip.oelf \
            --lib=build/nfs_heat_drift_grip.prx \
            --paid=0x3800000000000011

      - name: Upload .prx artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfs_heat_drift_grip.prx
          path: build/nfs_heat_drift_grip.prx
          retention-days: 7
